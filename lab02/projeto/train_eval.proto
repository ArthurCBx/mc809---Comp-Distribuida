syntax = "proto3";

package federated;

// protobuf3 nao aceita "repeated repeated": cada linha de X vira uma FeatureRow
message FeatureRow {
    repeated double values = 1;
}

message DataRequest {
    int32                client_id = 1;
    string               behavior  = 2;  // apenas para log/avaliacao, o servidor nao usa na decisao
    repeated FeatureRow  features  = 3;
    repeated int32       labels    = 4;
}

message DataResponse {
    bool   isBizantine     = 1;
    string message         = 2;
}

service ByzantineManager {
    rpc SendData (DataRequest) returns (DataResponse) {}
}
